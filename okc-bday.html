<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>人生遊戲</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a quiet text life-sim that keeps making him laugh, then turns tender at the end
   IDEA: his own black leather travel diary, one page per year, ink doodles in the margin
   PICTURE: a small ink drawing for each stage, drawn like his diary sketches
   COLOUR and TYPE: warm paper, black ink (he only wears black), cherry red for love; LXGW WenKai TC throughout
   LAYOUT: sticky top with age and four stat bars, a scrolling diary of years, one big button at the thumb */
:root{color-scheme:light dark;
--bg:light-dark(#f7f2e8,#16141a);--ink:light-dark(#1b1a1f,#f1ebdf);--mut:light-dark(#6d665c,#a59d92);
--card:light-dark(#fffdf8,#211e26);--rule:light-dark(#e3dacb,#34303b);--red:light-dark(#c8243a,#ee5a6f);
--h:light-dark(#2b9a7f,#45c4a3);--f:light-dark(#e09a1e,#f2b544);--k:light-dark(#3a68cf,#7d9ff0);--r:light-dark(#c8243a,#ee5a6f);
--fill:light-dark(#e9e1d2,#2d2934);--blue:light-dark(#8fa8bf,#6f8aa3)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "LXGW WenKai TC","PingFang HK","Microsoft JhengHei","Noto Sans HK",sans-serif;overflow-x:clip}
.scr{display:none;min-height:100vh;min-height:100dvh}
.scr.on{display:block}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}
button{font:inherit;font-weight:700;min-height:52px;border-radius:14px;border:2px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent}
button.alt{background:var(--card);color:var(--ink)}
button:active{transform:scale(.98)}
button:disabled{opacity:.35}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.px{position:relative;width:100%;max-width:300px;aspect-ratio:16/9;margin:6px auto 10px;container-type:inline-size}
.px img{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.px span{position:absolute;font-family:"DotGothic16","LXGW WenKai TC",monospace;line-height:1;white-space:nowrap;transform:translate(var(--tx),-82%);font-size:calc(var(--fs) * 0.625cqw)}

/* lock */
#lock .wrap{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-top:30px;padding-bottom:30px;text-align:center}
#lock h1{font-size:46px;line-height:1.05;margin:0}
#lock .sub{color:var(--mut);margin:0}
#lock form{display:grid;gap:12px;margin-top:10px}
#lock label{font-weight:700}
#pw{font:inherit;font-size:26px;letter-spacing:.2em;text-align:center;padding:10px;border-radius:14px;border:2px solid var(--ink);background:var(--card);color:var(--ink);width:100%}
#lockMsg{min-height:1.7em;color:var(--red);margin:0;font-weight:700}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}

/* game */
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--rule);padding:calc(env(safe-area-inset-top) + 10px) 0 10px}
#age{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
#age b{font-size:24px;line-height:1.2}
#age span{color:var(--mut);font-size:15px;white-space:nowrap}
#bars{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin-top:6px}
.bar{display:grid;grid-template-columns:2.4em 1fr 1.8em;gap:6px;align-items:center;font-size:14px;line-height:1.3}
.bar i{display:block;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar i u{display:block;height:100%;border-radius:4px;transition:width .6s}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.bar.pop em{color:var(--red);font-weight:700}
#log{padding:8px 0 140px}
.yr{padding:18px 0 14px;border-bottom:1px dashed var(--rule);scroll-margin-top:120px}
.yr h2{margin:0 0 2px;font-size:20px;line-height:1.3;display:flex;gap:10px;align-items:baseline}
.yr h2 small{color:var(--mut);font-size:15px;font-weight:400}
.yr p{margin:4px 0;opacity:0;animation:inn .5s forwards}
.yr p.res{color:var(--red);font-weight:700}
.chip{font-size:13px;color:var(--mut);white-space:nowrap}
@keyframes inn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#bot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:linear-gradient(transparent,var(--bg) 30%);padding:26px 0 calc(env(safe-area-inset-bottom) + 16px)}

/* modal */
#modal{position:fixed;inset:0;z-index:9;background:#0008;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom) + 20px);display:grid;gap:12px;animation:up .3s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet h3{margin:0;font-size:21px;line-height:1.4}
#sheet .q{color:var(--mut);margin:0;font-size:15px}
#sheet .out{font-size:18px;margin:0}
#sheet .fx{margin:0;color:var(--mut);font-size:15px}

/* endings */
.end .wrap{padding-top:calc(env(safe-area-inset-top) + 34px);padding-bottom:40px}
.end h1{font-size:36px;line-height:1.15;margin:0 0 6px}
.end .lead{color:var(--mut);margin:0 0 8px}
.end p{margin:8px 0}
.end .btns{display:grid;gap:10px;margin-top:22px}
#mq{position:relative;height:62vh;overflow:hidden;border-radius:18px;background:var(--card);border:2px solid var(--rule);margin-top:12px}
#mqIn{position:absolute;left:0;right:0;top:0;padding:0 16px}
#mqIn.run{animation:mq var(--d) linear forwards}
@keyframes mq{from{transform:translateY(62vh)}to{transform:translateY(-100%)}}
.mi{text-align:center;padding:16px 0;border-bottom:1px dashed var(--rule)}
.mi b{display:block;font-size:15px;color:var(--mut)}
.mi .px{max-width:200px;margin:4px auto}
.lc{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:18px;margin-top:14px;box-shadow:6px 6px 0 var(--ink)}
.lc h2{margin:0;font-size:26px}
.lc .row{display:flex;justify-content:space-between;gap:12px;border-top:1px dashed var(--rule);padding:7px 0}
.lc .row span:last-child{text-align:right;font-weight:700}
.lc .title{color:var(--red);font-weight:700;font-size:19px;margin:6px 0 10px}
#bday h1{font-size:44px;color:var(--red);text-align:center;line-height:1.1;margin:10px 0}
.letter{background:var(--card);border-radius:16px;padding:18px;border:2px solid var(--rule);font-size:18px;line-height:1.9}
#conf{position:fixed;inset:0;pointer-events:none;z-index:20;width:100%;height:100%}
@media(prefers-reduced-motion:reduce){.yr p,#sheet{animation:none;opacity:1}.bar i u{transition:none}}
</style>
</head>
<body>

<section class="scr on" id="lock"><div class="wrap">
  <div class="px" id="lockArt" aria-hidden="true"></div>
  <h1>人生遊戲</h1>
  <p class="sub">一個專屬小bb嘅人生</p>
  <form id="lockF" autocomplete="off">
    <label for="pw">我哋一齊嘅日子 (DDMMYYYY)</label>
    <input id="pw" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
    <p id="lockMsg" role="status"></p>
    <button type="submit">開始人生</button>
  </form>
</div></section>

<section class="scr" id="game">
  <div id="top"><div class="wrap">
    <div id="age"><b id="ageT">小bb · 0歲</b><span id="yrT">1993年</span></div>
    <div id="bars"></div>
  </div></div>
  <div class="wrap"><div id="log"></div></div>
  <div id="bot"><div class="wrap"><button id="next">開始</button></div></div>
</section>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="mq1"><div id="sheet"></div></div>

<section class="scr end" id="ending"><div class="wrap">
  <p class="lead">結局</p>
  <h1 id="endT"></h1>
  <div class="px" id="endArt" aria-hidden="true"></div>
  <div id="endP"></div>
  <div class="btns"><button id="toMq">睇人生跑馬燈</button></div>
</div></section>

<section class="scr end" id="recap"><div class="wrap">
  <h1>人生跑馬燈</h1>
  <p class="lead">小bb 嘅精彩片段</p>
  <div id="mq"><div id="mqIn"></div></div>
  <div class="btns"><button id="toCard">睇人生紀錄卡</button></div>
</div></section>

<section class="scr end" id="card"><div class="wrap">
  <h1>人生紀錄卡</h1>
  <div class="lc" id="lc"></div>
  <div class="btns"><button id="toBday">最後一頁</button></div>
</div></section>

<section class="scr end" id="bday"><div class="wrap">
  <div class="px" id="cakeArt" aria-hidden="true"></div>
  <h1>小bb<br>生日快樂！</h1>
  <div class="letter">
    <p style="margin:0">小bb：</p>
    <p>三十三歲生日快樂！</p>
    <p>由銅鑼灣嗰張剪髮椅開始，到青衣、到 Adelaide 同墨爾本嘅異地，再到我哋喺 Doncaster East 嘅屋企——多謝你一路陪住我。</p>
    <p>你嘅濕疹我幫你搽膏，你嘅花粉症我幫你遞紙巾，你對臭腳……我都接受晒。</p>
    <p>無論你揀倉、揀露營車，定係揀 PS5，我都想喺你隔籬。</p>
    <p style="text-align:right;margin-bottom:0">永遠愛你嘅<br>臭b</p>
  </div>
  <div class="btns"><button id="again">再玩一次，搵其他結局</button></div>
</div></section>
<canvas id="conf"></canvas>

const ENDS={
w:{t:'🏭 小bb 嘅倉',a:'warehouse',p:['你開咗一個好大嘅倉。','入面有咖啡店、生活家品同室內設計、傢俬、畫畫班，仲有唔同品牌輪流嚟開快閃店。','你喺畫畫班教人畫畫，臭b 坐喺咖啡店飲住咖啡，等你收工。','黑色圍裙、黑色衫、黑色褲。當然。']},
c:{t:'🚐 同臭b 嘅露營車人生',a:'caravan',p:['你同臭b 揸住露營車周圍去，車尾坐住兩隻狗。','朝早喺湖邊拉筋，夜晚喺車頂睇星。','做少啲，生活多啲。','（花粉季節，就揸去冇花嘅地方。）']},
h:{t:'🎮 Doncaster East 嘅家',a:'ps5',p:['放工返到屋企，換上毛毛睡褲（扯到上心口）。','打開 PS5，臭b 坐喺隔籬，一人一包營多。','冇咩特別，但每一日都好好。','人生，就係咁簡單。']}
};
const NAMES={h:'健康',f:'幸福',k:'知識',r:'關係'};
const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait=ms=>new Promise(r=>setTimeout(r,reduce?60:ms));
let S;
function fresh(){S={i:-1,s:{h:50,f:30,k:20,r:5},n:0,v:{w:0,c:0,h:0},moments:[]}}
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id===id));scrollTo(0,0)}
function bars(changed){
  $('bars').innerHTML=Object.keys(NAMES).map(k=>`<div class="bar ${changed&&changed[k]?'pop':''}"><span>${NAMES[k]}</span><i><u style="width:${S.s[k]}%;background:var(--${k})"></u></i><em>${S.s[k]}</em></div>`).join('');
}
function apply(fx){if(!fx)return'';const out=[];for(const k in fx){const d=fx[k]>0?Math.max(1,Math.round(fx[k]*.6)):fx[k];S.s[k]=Math.max(0,Math.min(100,S.s[k]+d));out.push(`${NAMES[k]} ${d>0?'+':''}${d}`)}bars(fx);return out.join('　')}
function line(box,t,cls,delay){const p=document.createElement('p');p.textContent=t;if(cls)p.className=cls;p.style.animationDelay=(reduce?0:delay)+'ms';box.appendChild(p);return p}
async function step(){
  const btn=$('next');btn.disabled=true;S.i++;
  if(S.i>=E.length){return toEnding()}
  const e=E[S.i],prev=E[S.i-1];
  const age=e.y-1993;
  $('ageT').textContent=`小bb · ${age}歲`;$('yrT').textContent=e.y+'年';
  const box=document.createElement('article');box.className='yr';
  box.innerHTML=`<h2>${e.y}年<small>${age}歲${prev&&prev.y===e.y?' · 續':''}</small></h2>${e.a?svg(e.a):''}`;
  $('log').appendChild(box);fillArts(box);
  box.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
  e.l.forEach((t,j)=>line(box,t,'',300+j*700));
  if(e.n)S.n+=e.n;
  if(e.m)S.moments.push({a:e.a||'heart',y:e.y,t:e.m});
  await wait(300+e.l.length*700);
  if(e.f){const t=apply(e.f);line(box,t,'chip',0)}
  if(e.c){const pick=await choose(e.c);line(box,'▸ '+pick[0],'',0);line(box,pick[1],'res',250);
    if(e.after){e.after.forEach((t,j)=>line(box,t,'',600+j*600));await wait(600+e.after.length*600)}
    if(e.af)line(box,apply(e.af),'chip',0)}
  btn.textContent=S.i===E.length-1?'睇結局':(E[S.i+1].y===e.y?'繼續':'下一年 ▸');
  btn.disabled=false;
}
function choose(c){return new Promise(res=>{
  const sh=$('sheet');
  sh.innerHTML=`<h3 id="mq1">${c.q}</h3><p class="q">揀一個</p>`+c.o.map((o,i)=>`<button class="alt" data-i="${i}">${o[0]}</button>`).join('');
  $('modal').classList.add('on');sh.querySelector('button').focus();
  sh.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const o=c.o[+b.dataset.i];const fx=apply(o[2]);if(o[3])S.v[o[3]]++;if(o[4])S.n+=o[4];
    sh.innerHTML=`<h3 id="mq1">${o[0]}</h3><p class="out">${o[1]}</p><p class="fx">${fx}</p><button id="ok">好</button>`;
    $('ok').focus();$('ok').onclick=()=>{$('modal').classList.remove('on');res(o)};
  });
})}
function pickEnd(){
  const v=S.v,m=Math.max(v.w,v.c,v.h),top=Object.keys(v).filter(k=>v[k]===m);
  if(top.length===1)return top[0];
  const by={w:S.s.k,c:S.s.h,h:S.s.f};return top.sort((a,b)=>by[b]-by[a])[0];
}
function toEnding(){
  const k=pickEnd(),d=ENDS[k];S.end=k;
  try{const u=JSON.parse(localStorage.getItem('xbbEnds')||'[]');if(!u.includes(k))u.push(k);localStorage.setItem('xbbEnds',JSON.stringify(u));S.got=u.length}catch(e){S.got=1}
  $('endT').textContent=d.t;draw($('endArt'),d.a);
  $('endP').innerHTML='';d.p.forEach((t,j)=>line($('endP'),t,'',300+j*700));
  S.moments.push({a:d.a,y:'將來',t:d.t});
  show('ending');
}
function toRecap(){
  const mi=$('mqIn');mi.classList.remove('run');
  mi.innerHTML=S.moments.map(m=>`<div class="mi"><b>${m.y}${typeof m.y==='number'?'年':''}</b>${svg(m.a)}<div>${m.t}</div></div>`).join('')+`<div class="mi"><b>今日</b>${svg('cake')}<div>33歲，生日快樂</div></div>`;fillArts(mi);
  show('recap');
  if(reduce){$('mq').style.overflow='auto';return}
  mi.style.setProperty('--d',(S.moments.length*2.6+4)+'s');void mi.offsetWidth;mi.classList.add('run');
}
function toCard(){
  const s=S.s,r=s.r,title=r>=90?'臭b認證 · 宇宙最好男朋友':r>=70?'臭b認證 · 好好男朋友':'臭b認證 · 有進步空間（但都好愛你）';
  $('lc').innerHTML=`<h2>小bb</h2><p class="title">${title}</p>
  <div class="row"><span>出世</span><span>1993年 · 內地</span></div>
  <div class="row"><span>今年</span><span>33歲</span></div>
  <div class="row"><span>職業</span><span>髮型師 · 2home 老闆</span></div>
  <div class="row"><span>花名</span><span>小bb · 小臭b · 火柴</span></div>
  <div class="row"><span>衫嘅顏色</span><span>黑色（唯一）</span></div>
  <div class="row"><span>營多撈麵</span><span>大約 ${(3000+S.n*250).toLocaleString()} 包</span></div>
  <div class="row"><span>結局</span><span>${ENDS[S.end].t}</span></div>
  ${Object.keys(NAMES).map(k=>`<div class="row"><span>${NAMES[k]}</span><span>${s[k]} / 100</span></div>`).join('')}
  <div class="row"><span>已解鎖結局</span><span>${S.got||1} / 3</span></div>`;
  show('card');
}
function toBday(){draw($('cakeArt'),'cake');show('bday');$('again').textContent=`再玩一次，搵其他結局（${S.got||1}/3）`;confetti()}
function confetti(){
  if(reduce)return;const c=$('conf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cs=['#c8243a','#e09a1e','#2b9a7f','#3a68cf','#1b1a1f'];
  const ps=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,v:2+Math.random()*3,s:6+Math.random()*6,c:cs[Math.floor(Math.random()*5)],r:Math.random()*6,w:Math.random()*2-1}));
  let f=0;const t=()=>{x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=p.w;p.r+=.08;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++f<300)requestAnimationFrame(t);else x.clearRect(0,0,c.width,c.height)};t();
}
function start(){fresh();$('log').innerHTML='';bars();$('ageT').textContent='小bb · 0歲';$('yrT').textContent='1993年';$('next').textContent='開始';$('next').disabled=false;show('game')}

/* lock */
const WRONG=['唔係喎……小臭b，你係咪唔記得咗？','錯！再諗清楚啲，今晚唔准打老虎㗎！','提示：嗰日你哋一齊咗㗎。','玩夠我未啊？再試多次啦！','錯咗。罰你今晚唔准拉筋！'];let wn=0;
draw($('lockArt'),'heartplain');
$('lockF').addEventListener('submit',ev=>{ev.preventDefault();const v=$('pw').value.replace(/\D/g,'');
  if(v==='14072021'){$('lockMsg').textContent='啱喇！歡迎返嚟你嘅人生。';setTimeout(start,reduce?0:700)}
  else{$('lockMsg').textContent=WRONG[wn++%WRONG.length];const f=$('lockF');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('pw').select()}});
$('next').addEventListener('click',step);
$('toMq').addEventListener('click',toRecap);
$('toCard').addEventListener('click',toCard);
$('toBday').addEventListener('click',toBday);
$('again').addEventListener('click',start);
}
